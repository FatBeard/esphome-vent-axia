# Reference ESP8266 config -- alextrical's wired-remote dongle.
#
# The ESP8266 has a single hardware UART, shared with USB programming, so the
# MVHR link takes it and the serial console is disabled.

esphome:
  name: vent-axia-esp8266
  min_version: 2024.11.0

esp8266:
  board: esp12e

logger:
  baud_rate: 0

external_components:
  - source:
      type: local
      path: ../components
    components: [vent_axia]

uart:
  id: vask_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600

vent_axia:
  id: vask
  uart_id: vask_uart
