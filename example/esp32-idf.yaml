# Reference ESP32 config, ESP-IDF framework.
#
# Present so CI proves the component carries no Arduino-specific dependency.
# The old component could not build here at all: its retransmit timer used the
# Arduino-ESP32 2.x API, which 3.x removed.

esphome:
  name: vent-axia-esp32-idf
  min_version: 2024.11.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../components
    components: [vent_axia]

uart:
  id: vask_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

vent_axia:
  id: vask
  uart_id: vask_uart
